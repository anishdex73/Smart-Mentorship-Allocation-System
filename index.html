<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentorship Allocation — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <strong>Mentor<span>ship</span></strong>
          <small>Allocation Studio</small>
        </div>
      </div>

      <div class="side-label">Workspace</div>
      <nav id="nav">
        <button class="nav-item active" data-view="overview"><span>⌂</span> Overview</button>
        <button class="nav-item" data-view="mentors"><span>◌</span> Mentors</button>
        <button class="nav-item" data-view="mentees"><span>◍</span> Mentees</button>
        <button class="nav-item" data-view="matching"><span>↔</span> Matching</button>
        <button class="nav-item" data-view="allocations"><span>✓</span> Allocations</button>
        <button class="nav-item" data-view="network"><span>⌘</span> Network</button>
        <button class="nav-item" data-view="analytics"><span>◒</span> Analytics</button>
        <button class="nav-item" data-view="methodology"><span>≡</span> Methodology</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="system-card">
          <div class="status-dot"></div>
          <div>
            <strong>Prototype active</strong>
            <small>Local data engine</small>
          </div>
        </div>
        <div class="project-note">DSA-II PBL · Quality Education</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="mobile-brand"><div class="brand-mark">M</div><strong>Mentorship</strong></div>
        <div class="top-actions">
          <span class="date" id="today"></span>
          <button class="icon-btn" id="resetBtn" title="Reset demo data">↻</button>
        </div>
      </header>

      <section id="app"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
